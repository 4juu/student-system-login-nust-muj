name: graphify-wheels
on: { push: { branches: [graphify-wheels] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  dl:
    if: "!contains(github.event.head_commit.message, '[built]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: |
          mkdir wh
          pip download graphifyy -d wh --only-binary=:all: --python-version 3.13 --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64 --platform linux_x86_64 --implementation cp || pip download graphifyy -d wh
          ls -la wh; du -sh wh
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add wh && git commit -qm "wheels [built]" && git push
