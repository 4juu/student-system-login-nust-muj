<!doctype html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"></head><body><title>تجربة المسح الجماعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f5f4;--card:#fff;--fg:#17201d;--mute:#5d6b66;--line:#d9e0dd;
  --accent:#0f6b55;--accent-fg:#fff;--ok:#1d7a3e;--ok-bg:#e3f3e8;--bad:#b3261e;--bad-bg:#fbe7e5;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--card:#1a211e;--fg:#e6ece9;--mute:#9aa8a2;--line:#2c3631;--accent:#3fbf98;--accent-fg:#06221a;--ok:#5fd18a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111614;--card:#1a211e;--fg:#e6ece9;--mute:#9aa8a2;--line:#2c3631;--accent:#3fbf98;--accent-fg:#06221a;--ok:#5fd18a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1a17;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl}
.wrap{max-width:480px;margin-inline:auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;text-align:center}
h2{font-size:16px;margin:8px 0 0}
.mute{color:var(--mute);font-size:14px;margin:0;text-align:center}
.btn{font:inherit;font-weight:500;font-size:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-align:center;display:block;width:100%}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{font-size:22px;padding:26px 16px}
.link{font:inherit;font-size:14px;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:8px}
.btn:focus-visible,select:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{font:inherit;font-size:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);width:100%}
.back{align-self:flex-start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--f-mono);font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.ok{background:var(--ok-bg);color:var(--ok)}
.stat.bad{background:var(--bad-bg);color:var(--bad)}
ol{margin:0;padding:0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:14px}
ol li{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
ol li:first-child{border-top:0}
ol li span{font-family:var(--f-mono);color:var(--mute);min-width:2ch;font-variant-numeric:tabular-nums}
#absent li{color:var(--bad)}
#pending{color:var(--accent);font-weight:500}

/* student screens */
#stuScreen,#grid{position:fixed;inset:0;background:#fff;color:#000;z-index:10}
#stuScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
#stuScreen canvas{width:min(94vw,78vh);height:auto;image-rendering:pixelated}
#stuScreen .num{font-size:20px;text-align:center}
#grid{display:grid;gap:3vw;padding:4vw;align-content:start;overflow:auto}
#grid canvas{width:100%;height:auto;image-rendering:pixelated}
.x{position:fixed;top:10px;inset-inline-start:10px;font:inherit;font-size:15px;background:#eee;color:#000;border:0;border-radius:10px;padding:8px 14px;z-index:11}

/* live camera */
#camView{position:fixed;inset:0;background:#000;z-index:20;color:#fff}
#camView video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camTop{position:absolute;top:0;inset-inline:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#000a,#0000);font-size:17px}
#camTop b{font-family:var(--f-mono);font-size:22px}
#camBot{position:absolute;bottom:0;inset-inline:0;padding:20px 16px 34px;display:flex;justify-content:center;align-items:center;background:linear-gradient(#0000,#000a)}
#zoomB{font:inherit;font-weight:700;font-size:18px;background:#fff3;color:#fff;border:2px solid #fff;border-radius:14px;padding:12px 18px;min-width:76px}
#camBot{gap:14px}
#camView video{transform-origin:50% 50%;transition:transform .2s}
#shutter{width:80px;height:80px;border-radius:50%;border:6px solid #fff;background:#fff4;flex:none}
#shutter:active{background:#fffb;transform:scale(.93)}
#camView.live #shutter{display:none}
#camView:not(.live) .dot{display:none}
#aim{position:absolute;left:50%;top:50%;width:56vmin;height:56vmin;transform:translate(-50%,-50%);border:3px solid #2ecc71cc;border-radius:18px;pointer-events:none}
#camView:not(.live) #aim{display:none}
#camDone{font:inherit;font-weight:700;font-size:19px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:14px 22px}
#camHint{position:absolute;top:50%;inset-inline:0;text-align:center;font-size:16px;opacity:.75;transform:translateY(-50%);pointer-events:none}
#camNew{position:absolute;bottom:110px;inset-inline:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#camNew div{background:#1a7f37e6;color:#fff;border-radius:10px;padding:6px 12px;font-size:16px;animation:pop 2.2s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-inline-end:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#flash.g{background:#2ecc71}
#flash.on{opacity:.35;transition:none}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" id="jsqrTag"></script>
<script>
const NAMES=["طالب 1", "طالب 2", "طالب 3", "طالب 4", "طالب 5", "طالب 6", "طالب 7", "طالب 8", "طالب 9", "طالب 10", "طالب 11", "طالب 12", "طالب 13", "طالب 14", "طالب 15", "طالب 16", "طالب 17", "طالب 18", "طالب 19", "طالب 20", "طالب 21", "طالب 22", "طالب 23", "طالب 24", "طالب 25", "طالب 26", "طالب 27", "طالب 28", "طالب 29", "طالب 30", "طالب 31", "طالب 32", "طالب 33", "طالب 34", "طالب 35", "طالب 36", "طالب 37", "طالب 38", "طالب 39", "طالب 40"];
const SLOT=3000, TOL_S=30, SECRET='demo-secret-v1';let MAXSIDE=2400;
const $=id=>document.getElementById(id);
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
function tag(n,slot){return String(fnv(SECRET+'|'+n+'|'+slot)%1000000).padStart(6,'0')}
function token(n,t){const s=Math.floor(t/SLOT);return n+'.'+(s%10000)+'.'+tag(n,s)}

function drawQR(cv,text,scale){
  const q=qrcode(0,'M');q.addData(text,'Alphanumeric');q.make();
  const m=q.getModuleCount(),qz=4,size=(m+qz*2)*scale;
  cv.width=size;cv.height=size;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,size,size);c.fillStyle='#000';
  for(let y=0;y<m;y++)for(let x=0;x<m;x++)if(q.isDark(y,x))c.fillRect((x+qz)*scale,(y+qz)*scale,scale,scale);
}

/* ---------- screens ---------- */
function show(id){for(const s of ['home','stu','lec'])$(s).hidden=s!==id}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('stuN').innerHTML=NAMES.map((n,i)=>'<option value="'+(i+1)+'">'+n+'</option>').join('');
try{const v=localStorage.getItem('scan_me');if(v)$('stuN').value=v}catch(e){}
$('stuN').onchange=()=>{try{localStorage.setItem('scan_me',$('stuN').value)}catch(e){}};

let lock=null;async function wake(on){try{if(on&&navigator.wakeLock)lock=await navigator.wakeLock.request('screen');else if(lock){await lock.release();lock=null}}catch(e){}}

let stuTimer=null;
function stuTick(){const n=+$('stuN').value||1,t=Date.now();drawQR($('stuC'),token(n,t),12);$('stuLbl').textContent=NAMES[n-1]||n;stuTimer=setTimeout(stuTick,SLOT-(t%SLOT)+5)}
$('stuGo').onclick=()=>{$('stuScreen').hidden=false;stuTick();wake(true)};
$('stuX').onclick=()=>{clearTimeout(stuTimer);$('stuScreen').hidden=true;wake(false)};

let gridTimer=null;
function gridTick(){const t=Date.now();$('grid').querySelectorAll('canvas').forEach((cv,i)=>drawQR(cv,token(i+1,t),8));gridTimer=setTimeout(gridTick,SLOT-(t%SLOT)+5)}
$('gridGo').onclick=()=>{
  const g=$('grid'),cols=innerWidth>innerHeight?6:3;g.innerHTML='<button class="x" id="gX">رجوع</button>';
  g.style.gridTemplateColumns='repeat('+cols+',1fr)';
  for(let i=0;i<12;i++)g.appendChild(document.createElement('canvas'));
  g.hidden=false;gridTick();wake(true);
  $('gX').onclick=()=>{clearTimeout(gridTimer);g.hidden=true;wake(false)};
};

/* ---------- decoding ---------- */
/* Scan a canvas for many QR codes: overlapping windows at several sizes, jsQR on each,
   whiting out each code found so the next try finds another. Runs in workers or on the page. */
async function scanMany(cv,mk,budget,yieldRows,kmax){
  const found=[],seenT=new Set();
  const c=cv.getContext('2d',{willReadFrequently:true}),W=cv.width,H=cv.height,short=Math.min(W,H);
  const tmp=mk(),tc=tmp.getContext('2d',{willReadFrequently:true});
  const t0=Date.now();
  for(let k=1;k<=(kmax||7);k++){
    const s=Math.round(short/k),step=Math.max(1,Math.round(s/2)),sc=Math.min(1,450/s),ts=Math.round(s*sc);
    tmp.width=ts;tmp.height=ts;
    const pos=(L)=>{const o=[];for(let q=0;q<=Math.max(0,L-s);q+=step)o.push(q);if(L>s&&o[o.length-1]<L-s)o.push(L-s);return o};
    const xs=pos(W),ys=pos(H);
    for(const y of ys){
      for(const x of xs){
        if(Date.now()-t0>budget)return found;
        for(let tries=0;tries<4;tries++){
          tc.drawImage(cv,x,y,s,s,0,0,ts,ts);
          const r=jsQR(tc.getImageData(0,0,ts,ts).data,ts,ts,{inversionAttempts:'dontInvert'});
          if(!r||!r.data)break;
          const L=r.location,pts=[L.topLeftCorner,L.topRightCorner,L.bottomRightCorner,L.bottomLeftCorner].map(p=>({x:x+p.x/sc,y:y+p.y/sc}));
          if(!seenT.has(r.data)){seenT.add(r.data);found.push(r.data)}
          const cx=pts.reduce((a,p)=>a+p.x,0)/4,cy=pts.reduce((a,p)=>a+p.y,0)/4;
          c.fillStyle='#fff';c.beginPath();pts.forEach((p,i)=>{const px=cx+(p.x-cx)*1.4,py=cy+(p.y-cy)*1.4;i?c.lineTo(px,py):c.moveTo(px,py)});c.closePath();c.fill();
        }
      }
      if(yieldRows)await new Promise(r=>setTimeout(r));
    }
  }
  return found;
}

/* fast pass for live video: jsQR on a few given rectangles only */
function scanRects(cv,mk,rects){
  const found=[],c=cv.getContext('2d',{willReadFrequently:true});
  const tmp=mk(),tc=tmp.getContext('2d',{willReadFrequently:true});
  for(const [x,y,w,h] of rects){
    const sc=Math.min(1,480/Math.max(w,h)),tw=Math.max(1,Math.round(w*sc)),th=Math.max(1,Math.round(h*sc));
    tmp.width=tw;tmp.height=th;
    for(let tries=0;tries<3;tries++){
      tc.drawImage(cv,x,y,w,h,0,0,tw,th);
      const r=jsQR(tc.getImageData(0,0,tw,th).data,tw,th,{inversionAttempts:'dontInvert'});
      if(!r||!r.data)break;
      if(!found.includes(r.data))found.push(r.data);
      const L=r.location,pts=[L.topLeftCorner,L.topRightCorner,L.bottomRightCorner,L.bottomLeftCorner].map(p=>({x:x+p.x/sc,y:y+p.y/sc}));
      const cx=pts.reduce((a,p)=>a+p.x,0)/4,cy=pts.reduce((a,p)=>a+p.y,0)/4;
      c.fillStyle='#fff';c.beginPath();pts.forEach((p,i)=>{const px=cx+(p.x-cx)*1.4,py=cy+(p.y-cy)*1.4;i?c.lineTo(px,py):c.moveTo(px,py)});c.closePath();c.fill();
    }
  }
  return found;
}
let native=null,workers=[],mode='page';
const nativeReady=(async()=>{if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))native=new BarcodeDetector({formats:['qr_code']})}catch(e){}}})();
/* try to build a small pool of background workers so photos are read in parallel without freezing the camera */
const workersReady=(async()=>{
  try{
    if(typeof OffscreenCanvas==='undefined'||typeof Worker==='undefined')return;
    const lib=await (await fetch($('jsqrTag').src)).text();
    const src=lib+'\n'+scanMany.toString()+'\n'+scanRects.toString()+'\n'+
      'onmessage=async e=>{const {id,bmp,ms,km,rects}=e.data;try{const cv=new OffscreenCanvas(bmp.width,bmp.height);cv.getContext("2d",{willReadFrequently:true}).drawImage(bmp,0,0);bmp.close&&bmp.close();'+
      'const r=rects?scanRects(cv,()=>new OffscreenCanvas(1,1),rects):await scanMany(cv,()=>new OffscreenCanvas(1,1),ms||12000,false,km);postMessage({id,r})}catch(err){postMessage({id,err:String(err)})}};postMessage({ready:1})';
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    const n=Math.max(1,Math.min(3,(navigator.hardwareConcurrency||2)-1));
    const made=await Promise.all(Array.from({length:n},()=>new Promise(res=>{
      try{const w=new Worker(url);const to=setTimeout(()=>{w.terminate();res(null)},4000);
        w.onmessage=e=>{if(e.data&&e.data.ready){clearTimeout(to);w.onmessage=null;res(w)}};w.onerror=()=>{clearTimeout(to);res(null)}}catch(e){res(null)}})));
    workers=made.filter(Boolean).map(w=>({w,busy:false}));
    if(workers.length)mode='workers';
  }catch(e){workers=[]}
})();
let wid=0;
function workerScan(slot,bmp,ms,km,rects){
  return new Promise((res,rej)=>{const id=++wid;slot.w.onmessage=e=>{if(e.data.id!==id)return;e.data.err?rej(e.data.err):res(e.data.r)};slot.w.postMessage({id,bmp,ms,km,rects},[bmp])});
}

/* ---------- ZXing-C++ (WebAssembly): the strong, fast reader. jsQR stays only as a fallback ---------- */
const ZX_URL='https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js';
const ZX_PHOTO={formats:['QRCode'],tryHarder:true,tryRotate:true,tryInvert:false,tryDownscale:true,maxNumberOfSymbols:255};
const ZX_LIVE={formats:['QRCode'],tryHarder:true,tryRotate:false,tryInvert:false,tryDownscale:true,maxNumberOfSymbols:255};
let zx=[],zxQ=[],zxId=0,engine='';
const zxReady=(async()=>{
  try{
    if(typeof Worker==='undefined')throw 0;
    const src="importScripts('"+ZX_URL+"');"+
      "onmessage=async e=>{const d=e.data;try{const r=await ZXingWASM.readBarcodes(new ImageData(new Uint8ClampedArray(d.buf),d.w,d.h),d.o);postMessage({id:d.id,r:r.filter(x=>x.isValid!==false&&x.text).map(x=>x.text)})}catch(err){postMessage({id:d.id,err:String(err)})}};"+
      "ZXingWASM.readBarcodes(new ImageData(8,8),{formats:['QRCode']}).then(()=>postMessage({ready:1}),err=>postMessage({fail:String(err)}));";
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    const n=Math.max(2,Math.min(4,(navigator.hardwareConcurrency||4)-1));
    const made=await Promise.all(Array.from({length:n},()=>new Promise(res=>{
      try{const w=new Worker(url);const to=setTimeout(()=>{w.terminate();res(null)},25000);
        w.onmessage=e=>{if(e.data&&(e.data.ready||e.data.fail)){clearTimeout(to);if(e.data.ready)res(w);else{w.terminate();res(null)}}};
        w.onerror=()=>{clearTimeout(to);res(null)}}catch(e){res(null)}})));
    zx=made.filter(Boolean).map(w=>({w,busy:false,cb:null}));
    zx.forEach(s=>s.w.onmessage=e=>{const cb=s.cb;s.cb=null;s.busy=false;if(cb)e.data.err?cb.rej(e.data.err):cb.res(e.data.r);zxPump()});
  }catch(e){zx=[]}
  if(!zx.length){
    /* workers refused it: run the same library on the page itself, one read at a time */
    try{
      await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=ZX_URL;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);setTimeout(rej,25000)});
      await ZXingWASM.readBarcodes(new ImageData(8,8),{formats:['QRCode']});
      let chain=Promise.resolve();
      const fake={busy:false,cb:null,w:{postMessage:(d)=>{chain=chain.then(async()=>{let m;try{const r=await ZXingWASM.readBarcodes(new ImageData(new Uint8ClampedArray(d.buf),d.w,d.h),d.o);m={r:r.filter(x=>x.isValid!==false&&x.text).map(x=>x.text)}}catch(err){m={err:String(err)}}
        const cb=fake.cb;fake.cb=null;fake.busy=false;if(cb)m.err?cb.rej(m.err):cb.res(m.r);await new Promise(r=>setTimeout(r));zxPump()})}}};
      zx=[fake];
    }catch(e){zx=[]}
  }
  if(zx.length){engine='zxing';MAXSIDE=3840}
})();
function zxPump(){
  for(const s of zx){if(!zxQ.length)return;if(s.busy)continue;
    const j=zxQ.shift();s.busy=true;s.cb=j;s.w.postMessage({id:++zxId,buf:j.img.data.buffer,w:j.img.width,h:j.img.height,o:j.o},[j.img.data.buffer])}
}
function zxRead(img,o,front){return new Promise((res,rej)=>{const j={img,o,res,rej};front?zxQ.unshift(j):zxQ.push(j);zxPump()})}
const zxIdle=()=>zx.some(s=>!s.busy)&&!zxQ.length;
/* one photo: the whole picture once, plus overlapping half-size tiles at full detail for small/far codes */
async function zxPhoto(cv){
  const c=cv.getContext('2d',{willReadFrequently:true}),W=cv.width,H=cv.height,short=Math.min(W,H);
  const rects=[[0,0,W,H]],s=Math.round(short/2),st=Math.round(s/2),xs=[],ys=[];
  for(let q=0;q<=W-s;q+=st)xs.push(q);if(xs[xs.length-1]<W-s)xs.push(W-s);
  for(let q=0;q<=H-s;q+=st)ys.push(q);if(ys[ys.length-1]<H-s)ys.push(H-s);
  for(const y of ys)for(const x of xs)rects.push([x,y,s,s]);
  const out=await Promise.all(rects.map(([x,y,w,h])=>zxRead(c.getImageData(x,y,w,h),ZX_PHOTO).catch(()=>[])));
  return [...new Set(out.flat())];
}

async function toBitmap(blob){
  let b;
  try{b=await createImageBitmap(blob)}catch(e){
    b=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(blob)});
  }
  const W=b.width||b.naturalWidth,H=b.height||b.naturalHeight,k=Math.min(1,MAXSIDE/Math.max(W,H));
  const cv=document.createElement('canvas');cv.width=Math.round(W*k);cv.height=Math.round(H*k);
  cv.getContext('2d',{willReadFrequently:true}).drawImage(b,0,0,cv.width,cv.height);
  b.close&&b.close();
  return cv;
}

function validate(text,lecT){
  const m=/^(\d{1,3})\.(\d{1,4})\.(\d{6})$/.exec(text);
  if(!m)return{ok:false,why:'غريب'};
  const n=+m[1],mod=+m[2],tg=m[3],ls=Math.floor(lecT/SLOT);
  if(n<1||n>NAMES.length)return{ok:false,why:'غريب'};
  let s=ls-((ls-mod)%10000+10000)%10000;if(ls-s>5000)s+=10000;
  if(tag(n,s)!==tg)return{ok:false,n,why:'مزوّر'};
  if(Math.abs(ls-s)>Math.ceil(TOL_S*1000/SLOT))return{ok:false,n,why:ls>s?'قديم':'ساعة خطأ'};
  return{ok:true,n};
}

/* ---------- background queue ---------- */
const present=new Set(),rejected={};let queue=[],running=0,shots=0,doneShots=0,camMode='';
function addShot(blob,lecT){shots++;queue.push({blob,lecT});pump();render()}
async function pump(){
  await Promise.all([nativeReady,workersReady,zxReady]);
  const limit=engine==='zxing'?2:mode==='workers'?workers.length:1;
  while(running<limit&&queue.length){
    const job=queue.shift();running++;
    runJob(job).then(()=>{job.blob=null}).catch(()=>{}).finally(()=>{running--;doneShots++;render();pump()});
  }
}
async function runJob(job){
  const lecT=job.lecT;let cv=await toBitmap(job.blob);job.blob=null;
  let texts=[];
  if(engine==='zxing'){texts=await zxPhoto(cv)}
  else{
  if(native){try{texts=(await native.detect(cv)).map(r=>r.rawValue).filter(Boolean)}catch(e){}}
  if(!texts.length){
    const free=workers.find(s=>!s.busy);
    if(free){free.busy=true;try{texts=await workerScan(free,await createImageBitmap(cv))}catch(e){texts=await scanMany(cv,()=>document.createElement('canvas'),12000,true)}finally{free.busy=false}}
    else texts=await scanMany(cv,()=>document.createElement('canvas'),12000,true);
  }
  }
  cv.width=cv.height=0;cv=null;
  accept(texts,lecT);
}
const seenBad=new Set();
function accept(texts,lecT){
  const neu=[];
  for(const t of texts){const v=validate(t,lecT);
    if(v.ok){if(!present.has(v.n)){present.add(v.n);neu.push(v.n)}}
    else if(!seenBad.has(t)){seenBad.add(t);rejected[v.why]=(rejected[v.why]||0)+1}}
  if(neu.length){
    try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
    flash('g');
    const box=$('camNew');
    for(const n of neu){const d=document.createElement('div');d.textContent='✓ '+NAMES[n-1];box.prepend(d);setTimeout(()=>d.remove(),2300)}
    while(box.children.length>4)box.lastChild.remove();
    $('camHint').hidden=true;render();
  }
}

function flash(cls){const f=$('flash');f.className='on '+(cls||'');requestAnimationFrame(()=>requestAnimationFrame(()=>f.className=cls||''))}
function render(){
  const left=shots-doneShots;
  $('nOk').textContent=present.size;$('nBad').textContent=NAMES.length-present.size;$('cOk').textContent=present.size;
  $('cAll').textContent=NAMES.length;$('eng').textContent=engine==='zxing'?'⚡':'';
  $('cQ').textContent=camMode==='photo'&&shots?('📸 '+shots+(left?' · ⏳ '+left:' ✓')):'';
  $('pending').textContent=left?('⏳ باقي '+left+' صورة تنقرا…'):(shots?('✓ انقرت '+shots+' صورة'):'');
  const r=Object.entries(rejected);$('rej').textContent=r.length?('مرفوض: '+r.map(([k,v])=>v+' '+k).join('، ')):'';
  const li=i=>'<li><span>'+(i+1)+'</span>'+NAMES[i]+'</li>';
  const idx=NAMES.map((_,i)=>i);
  $('absent').innerHTML=idx.filter(i=>!present.has(i+1)).map(li).join('')||'<li>ماكو غياب</li>';
  $('present').innerHTML=idx.filter(i=>present.has(i+1)).map(li).join('')||'<li>بعد ماكو أحد</li>';
}
render();zxReady.then(render);

/* ---------- camera: 📸 photo mode (one button, shot after shot) and ⚡ live mode ---------- */
let stream=null,live=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LIVEMAX=1280;
/* zoom: real lens zoom when the phone allows it, otherwise digital (crop the middle) */
let zoom=1,dz=1,hw=null;
const ZOOMS=[1,2,3];
async function setZoom(z){
  zoom=z;dz=z;const v=$('vid');
  if(hw){const hz=Math.max(hw.min,Math.min(hw.max,z));try{await hw.tr.applyConstraints({advanced:[{zoom:hz}]});dz=z/hz}catch(e){}}
  v.style.transform=dz>1?'scale('+dz+')':'';
  $('zoomB').textContent='🔍 '+z+'×';
}
$('zoomB').onclick=()=>setZoom(ZOOMS[(ZOOMS.indexOf(zoom)+1)%ZOOMS.length]);
function grab(v,max){
  const W=v.videoWidth,H=v.videoHeight,cw=W/dz,ch=H/dz,k=Math.min(1,(max||LIVEMAX)/Math.max(cw,ch));
  const cv=document.createElement('canvas');cv.width=Math.round(cw*k);cv.height=Math.round(ch*k);
  cv.getContext('2d',{willReadFrequently:true}).drawImage(v,(W-cw)/2,(H-ch)/2,cw,ch,0,0,cv.width,cv.height);return cv;
}
/* rectangles to try on one live frame: whole frame, the aim box, and two rotating tiles */
function liveRects(W,H,it){
  const sh=Math.min(W,H),r=[[0,0,W,H]],a=Math.round(sh*0.62);
  r.push([Math.round((W-a)/2),Math.round((H-a)/2),a,a]);
  for(const k of [2,3]){
    const t=Math.round(sh/k),st=Math.round(t/2),xs=[],ys=[];
    for(let q=0;q<=W-t;q+=st)xs.push(q);if(xs[xs.length-1]<W-t)xs.push(W-t);
    for(let q=0;q<=H-t;q+=st)ys.push(q);if(ys[ys.length-1]<H-t)ys.push(H-t);
    const n=xs.length*ys.length;
    for(const j of [0,1]){const i=(it*2+j+(k===3?(n>>1):0))%n;r.push([xs[i%xs.length],ys[Math.floor(i/xs.length)],t,t])}
  }
  return r;
}
async function lane(slot,off){
  const v=$('vid');let it=off;
  while(live){
    if(!v.videoWidth||v.readyState<2){await sleep(100);continue}
    const lecT=Date.now();let texts=[];
    try{
      if(engine==='zxing'){const cv=grab(v,1920);texts=await zxRead(cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height),ZX_LIVE,true)}
      else if(native){texts=(await native.detect(dz>1?grab(v):v)).map(r=>r.rawValue).filter(Boolean);await sleep(30)}
      else{const cv=grab(v),rects=liveRects(cv.width,cv.height,it++);
        if(slot)texts=await workerScan(slot,await createImageBitmap(cv),0,0,rects);
        else{texts=scanRects(cv,()=>document.createElement('canvas'),rects);await sleep(10)}}
    }catch(e){await sleep(150)}
    if(live&&texts&&texts.length)accept(texts,lecT);
  }
}
async function startLive(){
  if(!engine)$('camHint').textContent='⏳ لحظة، دا يحمّل القارئ…';
  await Promise.all([nativeReady,workersReady,zxReady]);
  if(!live)return;
  $('camHint').textContent='وجّه الكاميرا على الرموز';
  if(engine==='zxing'){zx.forEach((w,i)=>setTimeout(()=>lane(null,i),i*40));return}
  if(native||!workers.length)lane(null,0);
  else workers.forEach((w,i)=>lane(w,i*7));
}
async function openCam(m){
  camMode=m;
  try{
    const big=m==='photo';
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:big?3840:1920},height:{ideal:big?2160:1080}}});
    const v=$('vid');v.srcObject=stream;
    $('camView').className=m==='live'?'live':'';$('camView').hidden=false;
    $('camHint').hidden=false;$('camHint').textContent=m==='live'?'وجّه المربع على الرموز':'صوّر، وصوّر اللي بعدها مباشرة';
    await v.play().catch(()=>{});wake(true);
    const tr=stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
    hw=cap.zoom?{tr,min:cap.zoom.min||1,max:cap.zoom.max||1}:null;setZoom(1);
    if(m==='live'){live=true;startLive()}
    render();
  }catch(e){
    $('camMsg').hidden=false;$('snapAlt').hidden=false;
    $('camMsg').innerHTML='⚠️ الكاميرا المباشرة ممنوعة داخل هذي الصفحة.<br>افتح الرابط بـ <b>سفاري</b> أو <b>كروم</b> (مو داخل تطبيق Claude) وراح تشتغل.';
  }
}
$('camGo').onclick=()=>openCam('photo');
$('liveGo').onclick=()=>openCam('live');
/* 📸 one tap = one photo, kept only in memory, read in the background, then thrown away */
$('shutter').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  const lecT=Date.now(),cv=grab(v,MAXSIDE);flash();$('camHint').hidden=true;
  cv.toBlob(b=>{cv.width=cv.height=0;if(b)addShot(b,lecT)},'image/jpeg',0.9);
};
$('camDone').onclick=()=>{live=false;camMode='';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camView').hidden=true;wake(false);render();window.scrollTo(0,0)};

$('snapIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)addShot(f,Date.now())};
$('reset').onclick=()=>{present.clear();seenBad.clear();for(const k in rejected)delete rejected[k];queue=[];shots=running;doneShots=0;render()};
</script>
</body></html>
